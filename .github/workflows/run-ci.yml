name: Run CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: xdebug

      - name: Run CI checks
        run: bin/ci
        working-directory: ${{ github.workspace }}

      # - name: Commit Changes
      #   uses: stefanzweifel/git-auto-commit-action@v5
